name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build, Validate, and Dockerize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # -----------------------------------------------------------
      # Frontend CI: Install dependencies and build production bundle
      # -----------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      # -----------------------------------------------------------
      # Backend CI: Install dependencies and validate setup
      # -----------------------------------------------------------
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # -----------------------------------------------------------
      # Docker Build Validation: Build images locally in runner (No push)
      # -----------------------------------------------------------
      - name: Build Backend Docker Image
        run: docker build -t expense-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t expense-frontend:latest ./frontend
